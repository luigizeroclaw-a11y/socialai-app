<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Trap Quest</title>
<style>
  :root{ --bg:#07040f; --fg:#f4efff; --hot:#ff2bd6; --cyan:#22f2ff; --gold:#ffd23f; color-scheme:dark }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#07040f; --fg:#f4efff; --hot:#ff2bd6; --cyan:#22f2ff; --gold:#ffd23f } }
  :root[data-theme="dark"]{ --bg:#07040f; --fg:#f4efff; --hot:#ff2bd6; --cyan:#22f2ff; --gold:#ffd23f }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,"DejaVu Sans Mono",monospace;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;aspect-ratio:16/9;width:min(100vw,calc(100vh*16/9));max-width:100%;container-type:size;background:#000}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
  #start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2cqh;padding-bottom:8cqh;z-index:3}
  #play{all:unset;cursor:pointer;padding:1.4cqh 3cqw;border:.3cqw solid var(--gold);color:var(--gold);font-size:2cqw;letter-spacing:.3em;background:rgba(7,4,15,.7);box-shadow:0 0 2cqw rgba(255,210,63,.5)}
  #play:hover{background:var(--gold);color:var(--bg)} #play:focus-visible,#ctl button:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
  #start p{margin:0;font-size:1.1cqw;color:var(--cyan);letter-spacing:.15em;text-shadow:0 0 .6cqw #000}
  #ctl{position:absolute;left:0;right:0;bottom:0;display:flex;gap:1cqw;align-items:center;padding:1cqh 2cqw;opacity:0;transition:opacity .3s;background:linear-gradient(transparent,rgba(0,0,0,.75));z-index:2}
  #stage:hover #ctl,#ctl:focus-within{opacity:1}
  #ctl button{all:unset;cursor:pointer;color:var(--fg);font-size:max(12px,1.2cqw);padding:.4em .8em;border:1px solid var(--cyan)}
  #bar{flex:1;height:6px;background:rgba(255,255,255,.2);cursor:pointer;position:relative}
  #bar i{position:absolute;left:0;top:0;bottom:0;background:var(--hot);width:0}
  body.render #ctl,body.render #start{display:none}
  body.render #wrap{inset:auto;left:0;top:0;width:1280px;height:720px} body.render #stage{width:1280px}
</style>
<script src="data.js"></script>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="start"><button id="play">▶ PRESS START</button><p>Pixel Trap Quest · musica: elatedfolkpunk813 (Suno) · video: Claude</p></div>
  <div id="ctl"><button id="pp">Pausa</button><button id="rs">Da capo</button><div id="bar"><i></i></div></div>
</div></div>
<audio id="song" src="song.mp3" preload="auto"></audio>
<script>
'use strict';
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
const SONG = window.SONG, DUR = SONG.dur, FPS = SONG.fps;
const W = 1280, H = 720, PW = 320, PH = 180;
const out = document.getElementById('c').getContext('2d'); out.imageSmoothingEnabled = false;
const bufC = document.createElement('canvas'); bufC.width = PW; bufC.height = PH; const b = bufC.getContext('2d');
const tmpC = document.createElement('canvas'); tmpC.width = PW; tmpC.height = PH; const tmp = tmpC.getContext('2d');

/* ---------------- helpers ---------------- */
const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x));
const lerp = (a, c, t) => a + (c - a) * t;
const seg = (t, a, c) => clamp((t - a) / (c - a));
const sstep = (a, c, x) => { const t = clamp((x - a) / (c - a)); return t * t * (3 - 2 * t); };
const hash = (a, c = 0) => { const s = Math.sin(a * 127.1 + c * 311.7) * 43758.5453; return s - Math.floor(s); };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hsl(h, s, l) { h = ((h % 1) + 1) % 1; const k = n => (n + h * 12) % 12, a = s * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)); return `rgb(${f(0) * 255 | 0},${f(8) * 255 | 0},${f(4) * 255 | 0})`; }
const R = (x, y, w, h, c) => { b.fillStyle = c; b.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const feat = (arr, t) => { const i = clamp(t * FPS, 0, arr.length - 1); const i0 = Math.floor(i); return lerp(arr[i0], arr[Math.min(arr.length - 1, i0 + 1)], i - i0); };
const RMS = t => feat(SONG.rms, t), SUB = t => feat(SONG.sub, t), HI = t => feat(SONG.hi, t);
function lastIdx(arr, t) { let lo = 0, hi = arr.length - 1, r = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (arr[m] <= t) { r = m; lo = m + 1; } else hi = m - 1; } return r; }
const since = (arr, t) => { const i = lastIdx(arr, t); return i < 0 ? 99 : t - arr[i]; };
const env = (arr, t, tau) => Math.exp(-since(arr, t) / tau);
const thin = (arr, gap, a = 0, c = 1e9) => { const o = []; let last = -9; for (const x of arr) if (x >= a && x < c && x - last >= gap) { o.push(x); last = x; } return o; };
const snapB = x => { let best = x, d = 9; for (const v of SONG.beats) { if (Math.abs(v - x) < d) { d = Math.abs(v - x); best = v; } } return best; };

/* ---------------- song structure (from the analysis) ---------------- */
const B = [0, 6.1, 46.8, 53.2, 70.7, 73.0, 106.7, 113.7, 130.9, 133.0, 167.0, 173.5, 190.9, DUR].map((x, i, a) => i === 0 || i === a.length - 1 ? x : snapB(x));
const SCN = ['title', 'city', 'clear', 'hover', 'warning', 'boss', 'bossdown', 'space', 'glitch', 'tower', 'summit', 'finale', 'end'];
const sceneAt = t => { for (let i = SCN.length - 1; i >= 0; i--) if (t >= B[i]) return i; return 0; };
const KICK = SONG.kicks, SNARE = SONG.snares, HAT = SONG.hats;
const KBIG = KICK.filter(k => SUB(k + .03) > .55);

/* ---------------- pixel font ---------------- */
const FONT = { A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111', F: '111100110100100', G: '011100101101011', H: '101101111101101', I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111', M: '101111111101101', N: '110101101101101', O: '010101101101010', P: '110101110100100', Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010', U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101', Y: '101101010010010', Z: '111001010100111',
  '0': '111101101101111', '1': '010110010010111', '2': '110001010100111', '3': '110001010001110', '4': '101101111001001', '5': '111100110001110', '6': '011100111101111', '7': '111001010010010', '8': '111101111101111', '9': '111101111001110', '!': '010010010000010', '.': '000000000000010', ':': '000010000010000', '-': '000000111000000', ' ': '000000000000000', '+': '000010111010000', '×': '000101010101000', '?': '110001010000010', '/': '001001010100100', '>': '100010001010100', '(': '010100100100010', ')': '010001001001010', '©': '111101101101111', "'": '010010000000000', '·': '000000010000000' };
function txt(s, x, y, col, sc = 1, align = 'l', shadow = true) { s = String(s).toUpperCase(); const w = (s.length * 4 - 1) * sc; if (align === 'c') x -= w / 2; if (align === 'r') x -= w; x = Math.round(x); y = Math.round(y);
  if (shadow) draw(s, x + sc, y + sc, '#0a0612', sc); draw(s, x, y, col, sc); }
function draw(s, x, y, col, sc) { b.fillStyle = col; for (const ch of s) { const f = FONT[ch] || FONT[' ']; for (let i = 0; i < 15; i++) if (f[i] === '1') b.fillRect(x + (i % 3) * sc, y + Math.floor(i / 3) * sc, sc, sc); x += 4 * sc; } }

/* ---------------- sprites ---------------- */
const C = { K: '#120a1e', A: '#3a3f72', a: '#6d74b8', V: '#ff2bd6', v: '#ffd0f4', C: '#22f2ff', S: '#ff2bd6', G: '#ffd23f', O: '#ff7a1f', W: '#ffffff' };
// side view hero, facing right. (x,y)=feet, s=scale, ph=run phase, st:'run'|'jump'|'idle'
function heroSide(x, y, s, ph, st = 'run', shoot = 0) {
  const P = (px, py, w, h, c) => R(x + px * s, y + py * s, w * s, h * s, c);
  const leg = st === 'run' ? Math.sin(ph) : st === 'jump' ? .6 : 0, bob = st === 'run' ? Math.abs(Math.cos(ph)) : 0;
  const yb = -Math.round(bob);
  // scarf
  for (let i = 0; i < 6; i++) P(-4 - i, -13 + yb + Math.round(Math.sin(ph * .7 + i * .9)) + (i > 3 ? 1 : 0), 1, 1, C.S);
  // back leg / front leg
  P(-2 + Math.round(-leg * 2), -5, 2, 5, C.K); P(-2 + Math.round(-leg * 2), -1, 3, 1, C.K);
  P(0 + Math.round(leg * 2), -5, 2, 5, C.A); P(0 + Math.round(leg * 2), -1, 3, 1, C.K);
  // torso
  P(-3, -11 + yb, 6, 6, C.A); P(-3, -11 + yb, 6, 1, C.a); P(0, -9 + yb, 2, 2, C.C);
  // arm
  if (shoot) { P(2, -9 + yb, 5, 2, C.a); P(7, -9 + yb, 1, 2, C.C); } else { const ar = Math.round(Math.cos(ph) * 2 * (st === 'run' ? 1 : 0)); P(-1 + ar, -9 + yb, 2, 4, C.a); }
  // head + visor
  P(-3, -16 + yb, 6, 5, C.K); P(-2, -16 + yb, 5, 4, C.A); P(0, -14 + yb, 3, 1, C.V); P(2, -14 + yb, 1, 1, C.v); P(-1, -17 + yb, 1, 1, C.C);
}
// front view hero running toward the camera
function heroFront(x, y, s, ph) {
  const P = (px, py, w, h, c) => R(x + px * s, y + py * s, w * s, h * s, c);
  const l = Math.sin(ph), bob = -Math.round(Math.abs(Math.cos(ph)) * 1);
  P(-3, -6 + (l > 0 ? -1 : 0), 2, 6 + (l > 0 ? -1 : 0), C.K); P(1, -6 + (l < 0 ? -1 : 0), 2, 6 + (l < 0 ? -1 : 0), C.A);
  P(-4, -13 + bob, 8, 7, C.A); P(-4, -13 + bob, 8, 1, C.a); P(-1, -11 + bob, 2, 2, C.C);
  P(-6, -12 + bob + Math.round(l), 2, 5, C.a); P(4, -12 + bob - Math.round(l), 2, 5, C.a);
  P(-3, -19 + bob, 6, 6, C.K); P(-3, -18 + bob, 6, 4, C.A); P(-2, -16 + bob, 1, 1, C.V); P(1, -16 + bob, 1, 1, C.V); P(-2, -17 + bob, 4, 1, '#2a2050');
  P(0, -20 + bob, 1, 1, C.C);
}
function heroBack(x, y, s, lean) {
  const P = (px, py, w, h, c) => R(x + px * s, y + py * s, w * s, h * s, c);
  P(-8, -2, 16, 2, C.C); P(-9, -1, 18, 1, '#0b3a4a'); // hoverboard
  P(-3 + lean, -7, 2, 5, C.K); P(1 + lean, -7, 2, 5, C.K);
  P(-4 + lean, -14, 8, 7, C.A); P(-4 + lean, -14, 8, 1, C.a);
  P(-6 + lean, -13, 2, 5, C.a); P(4 + lean, -13, 2, 5, C.a);
  P(-3 + lean, -20, 6, 6, C.K); P(-2 + lean, -19, 4, 4, C.A); P(0 + lean, -21, 1, 1, C.C);
  for (let i = 0; i < 4; i++) P(2 + lean + i, -15 + i % 2, 1, 1, C.S);
}
function coin(x, y, t, s = 1) { const f = Math.floor(t * 10) % 4, w = [6, 4, 2, 4][f] * s; R(x - w / 2, y - 3 * s, w, 6 * s, C.G); R(x - w / 2, y - 3 * s, Math.max(1, w / 3), 6 * s, '#fff6c0'); if (w > 2) R(x - w / 2 + w - s, y - 3 * s, s, 6 * s, '#c48a00'); }
function boom(x, y, age, size = 1, seed = 0) {
  if (age < 0 || age > .9) return; const r = rng(seed * 997 + 3); const n = 26;
  const ring = age * 70 * size; if (age < .25) { const rr = Math.round(ring * .7); for (let a = 0; a < 24; a++) { const an = a / 24 * 6.28; R(x + Math.cos(an) * rr, y + Math.sin(an) * rr, 2, 2, '#fff6d0'); } }
  for (let i = 0; i < n; i++) { const an = r() * 6.28, sp = (20 + r() * 60) * size, d = sp * (1 - Math.exp(-age * 5)) / 1.2; const life = .5 + r() * .4; if (age > life) continue; const k = age / life; const col = k < .25 ? '#ffffff' : k < .5 ? '#ffe14a' : k < .75 ? '#ff7a1f' : '#9a2a4a'; const sz = Math.max(1, Math.round((3 - k * 2) * size)); R(x + Math.cos(an) * d, y + Math.sin(an) * d * .8 - age * 10, sz, sz, col); }
  if (age < .15) R(x - 6 * size, y - 6 * size, 12 * size, 12 * size, '#ffffff');
}
function sparkle(x, y, age, col = '#fff') { if (age < 0 || age > .35) return; const d = Math.round(age * 24); R(x - d, y, 1, 1, col); R(x + d, y, 1, 1, col); R(x, y - d, 1, 1, col); R(x, y + d, 1, 1, col); if (age < .1) R(x - 1, y - 1, 3, 3, col); }
function starfield(t, speed, seed = 1, n = 120, streak = 0) { const r = rng(seed); for (let i = 0; i < n; i++) { const z = .2 + r() * .8, x0 = r() * PW, y = r() * PH; const x = ((x0 - t * speed * z) % PW + PW) % PW; const c = z > .8 ? '#ffffff' : z > .5 ? '#9fb4ff' : '#4a4f8a'; if (streak > 0) R(x, y, Math.max(1, streak * z * 30), 1, c); else R(x, y, 1, 1, c); } }
function neonGrid(t, hz, speed, colA = '#ff2bd6', colB = '#22f2ff', kp = 0) {
  R(0, hz, PW, PH - hz, '#06020f');
  for (let k = 0; k < 14; k++) { const z = ((k + (t * speed) % 1) / 14); const y = Math.round(hz + Math.pow(z, 2.4) * (PH - hz)); R(0, y, PW, 1, colB); }
  b.fillStyle = colA; for (let i = -40; i <= 40; i++) for (let y = hz; y < PH; y += 1) { const z = (y - hz + 1) / (PH - hz); b.fillRect(Math.round(160 + i * 9 * (.15 + z * 2.2)), y, 1, 1); }
  R(0, hz, PW, 1, kp > .5 ? '#ffffff' : colA);
}
function sunStripes(cx, cy, r, t) { for (let y = -r; y < r; y++) { if (y > 0 && (y % 6) < y / 6) continue; const w = Math.sqrt(r * r - y * y); b.fillStyle = `rgb(255,${Math.round(lerp(230, 40, (y + r) / (2 * r)))},${Math.round(lerp(80, 190, (y + r) / (2 * r)))})`; b.fillRect(Math.round(cx - w), cy + y, Math.round(w * 2), 1); } }

/* ---------------- transitions ---------------- */
function iris(t, at, dur = .3) { const k = Math.abs(t - at) / dur; if (k >= 1) return; const r = Math.max(0, k * k * 200); tmp.clearRect(0, 0, PW, PH); tmp.drawImage(bufC, 0, 0); R(0, 0, PW, PH, '#000'); b.save(); b.beginPath(); b.arc(160, 100, r, 0, 7); b.clip(); b.drawImage(tmpC, 0, 0); b.restore(); }
function flash(t, at, dur = .25, col = '255,255,255') { const k = (t - at) / dur; if (k < 0 || k > 1) return; b.fillStyle = `rgba(${col},${1 - k})`; b.fillRect(0, 0, PW, PH); }
function slices(amt, t) { if (amt <= .02) return; tmp.clearRect(0, 0, PW, PH); tmp.drawImage(bufC, 0, 0); const f = Math.floor(t * 30); for (let i = 0; i < Math.floor(amt * 12); i++) { const y = Math.floor(hash(f, i) * PH), h = 1 + Math.floor(hash(i, f) * 10), dx = Math.round((hash(i * 3, f) - .5) * 60 * amt); b.drawImage(tmpC, 0, y, PW, h, dx, y, PW, h); } }

/* ---------------- HUD ---------------- */
const COIN_EVENTS = []; // filled by scenes (time of each coin pickup)
function hud(t, world, extra) { R(0, 0, PW, 11, 'rgba(7,4,15,.75)'); txt('SCORE ' + String(score(t)).padStart(7, '0'), 4, 3, '#ffffff', 1, 'l', false); coin(112, 5, t * .3); txt('×' + String(coinsAt(t)).padStart(3, '0'), 118, 3, C.G, 1, 'l', false); txt(world, 200, 3, C.C, 1, 'l', false); if (extra) txt(extra, 316, 3, C.V, 1, 'r', false); }
const coinsAt = t => lastIdx(COIN_EVENTS, t) + 1;
const score = t => coinsAt(t) * 100 + Math.floor(Math.max(0, t - B[1]) * 37) * 10 + (t > B[6] ? 50000 : 0);

/* ======================= SCENES ======================= */
// ---- shared: run scroll for the city level
const SCR = (() => { const a = new Float32Array(SONG.rms.length + 1); for (let i = 0; i < SONG.rms.length; i++) a[i + 1] = a[i] + (62 + 70 * SONG.rms[i]) / FPS; return a; })();
const scrollAt = t => { const i = clamp(t * FPS, 0, SCR.length - 1); const i0 = Math.floor(i); return lerp(SCR[i0], SCR[Math.min(SCR.length - 1, i0 + 1)], i - i0); };
const HERO_X = 96, GROUND = 150;
const CITY_JUMPS = thin(SNARE, .62, B[1] + .5, B[2] - 1.2);
const JDUR = .44;
const jumpY = (jumps, t, h = 36) => { const i = lastIdx(jumps, t); if (i < 0) return 0; const u = (t - jumps[i]) / JDUR; return u < 1 ? -h * 4 * u * (1 - u) : 0; };
const CITY_COINS = thin(HAT, .3, B[1] + 1, B[2] - 1.5); COIN_EVENTS.push(...CITY_COINS);
const STOMPS = CITY_JUMPS.filter((_, i) => i % 3 === 1).map(j => j + JDUR);
const FLAG_T = B[2] - .45;

function sceneTitle(t) {
  R(0, 0, PW, PH, '#07040f'); starfield(t, 4, 3, 140); sunStripes(160, 96, 30, t);
  neonGrid(t, 100, .6, '#ff2bd6', '#22f2ff', env(KICK, t, .1));
  const title = 'PIXEL TRAP QUEST'; const shown = Math.floor(seg(t, .3, 4.3) * title.length + .999);
  const kp = env(SONG.beats, t, .12);
  for (let i = 0; i < shown; i++) { const ch = title[i]; const drop = clamp((t - (.3 + i * .25)) / .25); const x = 160 - (title.length * 4 * 3) / 2 + i * 12; txt(ch, x, 34 - (1 - drop) * 30, i < 5 ? C.V : i < 10 ? C.C : C.G, 3); }
  if (t > 4.3) txt('A SUNO SOUNDTRACK · A CLAUDE VIDEO', 160, 60, '#b8a8ff', 1, 'c');
  heroFront(160, 160, 3, 0);
  if (t > 2 && Math.floor(t / .209) % 2 === 0) txt('PRESS START', 160, 168, '#ffffff', 1, 'c');
  if (t > 5.4) { const k = seg(t, 5.4, B[1]); R(160 - 40 * k, 166, 80 * k, 9, C.G); txt('START!', 160, 168, '#07040f', 1, 'c', false); }
  txt('1P', 6, 6, C.G); txt('HI 9999999', 314, 6, '#ffffff', 1, 'r');
}

function sceneCity(t) {
  const sx = scrollAt(t) - scrollAt(B[1]); const kp = env(KICK, t, .1);
  // sky
  const g = b.createLinearGradient(0, 0, 0, 120); g.addColorStop(0, '#0b0420'); g.addColorStop(1, '#3b0f4f'); b.fillStyle = g; b.fillRect(0, 0, PW, 140);
  starfield(t, 2, 7, 60); b.fillStyle = '#ffe9b0'; b.beginPath(); b.arc(256, 30, 10, 0, 7); b.fill(); b.fillStyle = '#0b0420'; b.beginPath(); b.arc(261, 27, 9, 0, 7); b.fill();
  // far skyline
  for (const [layer, par, hmin, hmax, col, seed] of [[0, .15, 30, 70, '#1d0b3a', 11], [1, .35, 40, 95, '#2a1150', 21]]) {
    const off = sx * par; const w = 22; const i0 = Math.floor(off / w);
    for (let i = i0; i < i0 + PW / w + 2; i++) { const h = hmin + hash(i, seed) * (hmax - hmin); const x = i * w - off; R(x, 140 - h, w - 2, h, col);
      for (let wy = 0; wy < h - 6; wy += 6) for (let wx = 3; wx < w - 5; wx += 5) if (hash(i * 7 + wx, wy + seed) > .55) R(x + wx, 140 - h + 4 + wy, 2, 2, hash(i, wy) > .7 ? '#ff2bd6' : '#ffd23f');
      if (layer === 1 && hash(i, 99) > .72) { const words = ['TRAP', '808', 'QUEST', 'NEON', 'BPM143', 'PIXEL']; const wd = words[Math.floor(hash(i, 98) * words.length)]; const on = Math.sin(t * 6 + i) > -.6 || kp > .4; txt(wd, x + (w - 2) / 2, 140 - h - 8, on ? (hash(i, 97) > .5 ? C.V : C.C) : '#3a2150', 1, 'c', false); } } }
  // explosions in the background on big 808s (like the cover)
  for (const k of KBIG) { if (k < B[1] || k > B[2]) continue; const age = t - k; if (age < 0 || age > .9) continue; const side = hash(k) > .5 ? 1 : -1; boom(160 + side * (70 + hash(k, 2) * 60), 95 + hash(k, 3) * 25, age, 1.2, Math.floor(k * 100)); }
  // road

/* ======================= FRAME ======================= */
COIN_EVENTS.sort((a, c) => a - c);
const SCENEFN = [sceneTitle, sceneCity, sceneClear, sceneHover, sceneWarning, sceneBoss, sceneBossDown, sceneSpace, sceneGlitch, sceneTower, sceneSummit, sceneFinale, sceneEnd];
function frame(t) {

if (RENDER) window.__film = { duration: DUR, frame: t => { frame(t); return true; }, ready: Promise.resolve(true) };
else {
  const audio = document.getElementById('song'), barEl = document.querySelector('#bar i'), pp = document.getElementById('pp'); let started = false;
  const play = from => { audio.currentTime = from; audio.play(); started = true; document.getElementById('start').hidden = true; pp.textContent = 'Pausa'; };

  loop();
}
