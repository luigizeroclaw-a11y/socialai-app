<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Il Taglio del Drago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#ece2cc; --ink:#1b1714; --red:#c23b22; --bg:#0e0c0b; --muted:#9b8f7c; color-scheme:dark }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#ece2cc; --ink:#1b1714; --red:#c23b22; --bg:#0e0c0b; --muted:#9b8f7c } }
  :root[data-theme="dark"]{ --paper:#ece2cc; --ink:#1b1714; --red:#c23b22; --bg:#0e0c0b; --muted:#9b8f7c }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--paper);font-family:"Shippori Mincho",Georgia,serif;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;aspect-ratio:16/9;width:min(100vw,calc(100vh*16/9));max-width:100%;container-type:size;background:var(--paper)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6cqh;background:rgba(236,226,204,.55);z-index:3}
  #start .k{font-family:"Yuji Syuku",serif;font-size:7cqw;color:var(--ink);line-height:1}
  #start h1{margin:0;font-weight:800;font-size:3.4cqw;color:var(--ink);letter-spacing:.06em}
  #start p{margin:0;color:#4a3f35;font-size:1.5cqw}
  #play{all:unset;cursor:pointer;padding:1.4cqh 2.8cqw;background:var(--red);color:var(--paper);font-weight:800;font-size:1.7cqw;letter-spacing:.12em;border-radius:2px;box-shadow:0 .6cqw 2cqw rgba(120,30,10,.35)}
  #play:focus-visible,#ctl button:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
  #ctl{position:absolute;left:0;right:0;bottom:0;display:flex;gap:1cqw;align-items:center;padding:1cqh 2cqw;opacity:0;transition:opacity .3s;background:linear-gradient(transparent,rgba(27,23,20,.6));z-index:2}
  #stage:hover #ctl,#ctl:focus-within{opacity:1}
  #ctl button{all:unset;cursor:pointer;color:var(--paper);font-size:max(13px,1.3cqw);padding:.4em .8em;border:1px solid rgba(236,226,204,.5)}
  #bar{flex:1;height:5px;background:rgba(236,226,204,.3);cursor:pointer;position:relative}
  #bar i{position:absolute;left:0;top:0;bottom:0;background:var(--red);width:0}
  body.render #ctl,body.render #start{display:none}
  body.render #wrap{inset:auto;left:0;top:0;width:1280px;height:720px} body.render #stage{width:1280px}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="start"><div class="k">龍斬</div><h1>Il Taglio del Drago</h1><p>Un cortometraggio a inchiostro · 48 secondi · con audio</p><button id="play">GUARDA</button></div>
  <div id="ctl"><button id="pp">Pausa</button><button id="rs">Da capo</button><div id="bar"><i></i></div></div>
</div></div>
<script>
'use strict';
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
const W = 1280, H = 720, DUR = 48;
const cv = document.getElementById('c'), g = cv.getContext('2d');

/* ---------------- math ---------------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const pulse = (t, a, b, fi = .3, fo = .3) => sstep(a, a + fi, t) * (1 - sstep(b - fo, b, t));
const easeOut = x => 1 - Math.pow(1 - x, 3), easeIn = x => x * x * x, easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const h1 = x => { const s = Math.sin(x * 127.1) * 43758.5453; return s - Math.floor(s); };
const n1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(h1(i), h1(i + 1), u); };
const fbm1 = x => n1(x) * .55 + n1(x * 2.1 + 3) * .28 + n1(x * 4.3 + 7) * .17;
const sn = (x, s = 0) => n1(x + s * 31.7) * 2 - 1;

/* ---------------- palette ---------------- */
const INK = a => `rgba(27,23,20,${a})`, PAPER = a => `rgba(236,226,204,${a})`, RED = a => `rgba(194,59,34,${a})`;

/* ---------------- canvases ---------------- */
function mk() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }
const bgC = mk(), bg = bgC.getContext('2d');
const paperC = mk();
{ const p = paperC.getContext('2d'); p.fillStyle = '#ece2cc'; p.fillRect(0, 0, W, H);
  const id = p.getImageData(0, 0, W, H), d = id.data, r = rng(9);
  for (let i = 0; i < d.length; i += 4) { const v = (r() - .5) * 14 + (n1((i / 4 % W) * .02) - .5) * 6; d[i] += v; d[i + 1] += v; d[i + 2] += v * .9; }
  p.putImageData(id, 0, 0);
  for (let k = 0; k < 900; k++) { const x = r() * W, y = r() * H, l = 6 + r() * 26, a = r() * 6.28; p.strokeStyle = `rgba(120,100,70,${.04 + r() * .06})`; p.lineWidth = .6; p.beginPath(); p.moveTo(x, y); p.quadraticCurveTo(x + Math.cos(a) * l * .5 + 3, y + Math.sin(a) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); p.stroke(); }
  const vg = p.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95); vg.addColorStop(0, 'rgba(90,70,40,0)'); vg.addColorStop(1, 'rgba(90,70,40,.28)'); p.fillStyle = vg; p.fillRect(0, 0, W, H); }

/* ---------------- brush helpers ---------------- */
// variable-width stroke along a polyline: pts [[x,y],...], wf(s)->width
function brush(c, pts, wf, color, rough = .15, seed = 1) {
  const n = pts.length; if (n < 2) return; const L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)]; let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const s = i / (n - 1), w = wf(s) * (1 + sn(i * .7, seed) * rough) / 2;
    L.push([pts[i][0] - dy * w, pts[i][1] + dx * w]); R.push([pts[i][0] + dy * w, pts[i][1] - dx * w]);
  }
  c.beginPath(); c.moveTo(L[0][0], L[0][1]); for (const p of L) c.lineTo(p[0], p[1]); for (let i = n - 1; i >= 0; i--) c.lineTo(R[i][0], R[i][1]); c.closePath(); c.fillStyle = color; c.fill();
}
const taper = (a = .15, b = .25) => s => sstep(0, a, s) * (1 - sstep(1 - b, 1, s)) * .85 + .15;
function curve(p0, p1, p2, n = 24) { const o = []; for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; o.push([u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]]); } return o; }
function cubic(p0, p1, p2, p3, n = 30) { const o = []; for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; o.push([u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]); } return o; }
function poly(c, pts, fill) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (const p of pts) c.lineTo(p[0], p[1]); c.closePath(); c.fillStyle = fill; c.fill(); }
function blob(c, x, y, rx, ry, col, rot = 0) { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); c.fillStyle = col; c.fill(); }

/* ---------------- camera ---------------- */
let cam = { x: 640, y: 360, z: 1 }, shake = 0;
function camT(c, d) { const z = 1 + (cam.z - 1) * d, cx = W / 2 + (cam.x - W / 2) * d, cy = H / 2 + (cam.y - H / 2) * d; c.setTransform(z, 0, 0, z, W / 2 - cx * z + shake * sn(T * 23, 1) * 9, H / 2 - cy * z + shake * sn(T * 21, 2) * 9); }
let T = 0;

/* ---------------- landscape ---------------- */
const cone = (x, px, h, w) => { const d = Math.abs(x - px) / w; return d < 1 ? h * Math.pow(1 - d, 1.5) : 0; };
function ridge(c, o) {
  const top = []; for (let x = -200; x <= W + 200; x += 4) { let y = o.y - o.amp * fbm1(x / o.sc + o.seed); for (const p of o.peaks || []) y -= cone(x, p[0], p[1], p[2]) * (1 + .08 * sn(x * .05, o.seed)); top.push([x, y]); }
  c.beginPath(); c.moveTo(-200, H + 200); for (const p of top) c.lineTo(p[0], p[1]); c.lineTo(W + 200, H + 200); c.closePath();
  const minY = Math.min(...top.map(p => p[1]));
  const gr = c.createLinearGradient(0, minY, 0, o.y + o.fade); gr.addColorStop(0, INK(o.a)); gr.addColorStop(.45, INK(o.a * .55)); gr.addColorStop(1, INK(0)); c.fillStyle = gr; c.fill();
  c.beginPath(); top.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.strokeStyle = INK(o.a * .9); c.lineWidth = o.lw || 1.6; c.stroke();
  const r = rng(o.seed * 100 | 0); // texture strokes (cun)
  for (let k = 0; k < (o.cun || 0); k++) { const i = Math.floor(r() * top.length), p = top[i], l = 20 + r() * 60; c.strokeStyle = INK(o.a * (.25 + r() * .3)); c.lineWidth = .8 + r(); c.beginPath(); c.moveTo(p[0], p[1] + 2); c.quadraticCurveTo(p[0] + (r() - .5) * 20, p[1] + l * .5, p[0] + (r() - .5) * 30, p[1] + l); c.stroke(); }
}
function mist(c, y, h, a, speed, seed) { const r = rng(seed); for (let k = 0; k < 8; k++) { const x = ((r() * 1800 + T * speed) % 1900) - 300, yy = y + (r() - .5) * h, rx = 220 + r() * 220, ry = h * (.5 + r() * .5); const gr = c.createRadialGradient(x, yy, 0, x, yy, rx); gr.addColorStop(0, PAPER(a)); gr.addColorStop(.6, PAPER(a * .6)); gr.addColorStop(1, PAPER(0)); c.save(); c.translate(x, yy); c.scale(1, ry / rx); c.translate(-x, -yy); c.fillStyle = gr; c.beginPath(); c.arc(x, yy, rx, 0, 7); c.fill(); c.restore(); } }

/* ---------------- dragon ---------------- */
function catmull(P, n = 16) { const o = []; for (let i = 0; i < P.length - 1; i++) { const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)]; for (let k = 0; k < n; k++) { const t = k / n, t2 = t * t, t3 = t2 * t; o.push([.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3), .5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]); } } o.push(P[P.length - 1]); return o; }
function arcTable(pts) { const d = [0]; for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return d; }
function atU(pts, d, u) { u = clamp(u, 0, d[d.length - 1]); let lo = 0, hi = d.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (d[m] < u) lo = m; else hi = m; } const f = (u - d[lo]) / ((d[hi] - d[lo]) || 1); return [lerp(pts[lo][0], pts[hi][0], f), lerp(pts[lo][1], pts[hi][1], f)]; }
// far flight path
const farPath = (() => { const P = []; for (let u = 0; u <= 1500; u += 10) { P.push([u - 340, 250 + 46 * Math.sin(u / 85) - Math.max(0, u - 1000) * 0 + Math.pow(Math.max(0, u - 1050), 2) * .0042]); } return P; })();
const farD = arcTable(farPath);
const nearPath = catmull([[150, 1250], [170, 980], [330, 760], [250, 590], [330, 450], [470, 400], [520, 300], [610, 235]], 18);
const nearD = arcTable(nearPath);
const NEAR_END = nearD[nearD.length - 1];
function dragonPose(t) {
  if (t < 18.4) { const u = (t - 10.5) * 175 + 400; return { path: farPath, d: farD, u, L: 360, w0: 11, hs: .23, mouth: .1, a: .78, wob: 6, dir: 1 }; }
  const e = easeOut(seg(t, 19.2, 20.15)); const u = lerp(NEAR_END - 1500, NEAR_END, e) + Math.sin(t * 1.3) * 6;
  return { path: nearPath, d: nearD, u, L: 1180, w0: 50, hs: 1.05, mouth: .25 + .75 * pulse(t, 19.6, 21.0, .2, .5) + .45 * pulse(t, 31.4, 33.4, .1, .8), a: 1, wob: 14, dir: 1 };
}
function spine(P, n = 90) { const pts = []; for (let i = 0; i <= n; i++) { const s = i / n; const p = atU(P.path, P.d, P.u - s * P.L); const q = atU(P.path, P.d, P.u - s * P.L - 4); let nx = -(p[1] - q[1]), ny = p[0] - q[0]; const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l; const wv = P.wob * Math.sin(s * 9 - T * 3) * sstep(0, .15, s); pts.push([p[0] + nx * wv, p[1] + ny * wv]); } return pts; }
function drawDragon(c, P, alpha = 1) {
  if (P.u < -100) return; const pts = spine(P), n = pts.length - 1; c.save(); c.globalAlpha = P.a * alpha;
  const wf = s => P.w0 * (s < .06 ? lerp(.8, 1, s / .06) : 1) * Math.pow(1 - s, .55) * (1 + .12 * Math.sin(s * 30));
  // legs
  for (const [s, side] of [[.17, 1], [.2, -1], [.5, 1], [.53, -1]]) { const i = Math.round(s * n), p = pts[i], q = pts[i + 1]; let dx = q[0] - p[0], dy = q[1] - p[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l; const nx = -dy * side, ny = dx * side; const k = P.w0 * .9;
    const knee = [p[0] + nx * k * 1.1 - dx * k * .3, p[1] + ny * k * 1.1 - dy * k * .3], foot = [knee[0] + nx * k * .3 - dx * k * .9, knee[1] + ny * k * .3 - dy * k * .9 + k * .3];
    brush(c, curve(p, knee, foot, 10), x => P.w0 * .36 * (1 - x * .5), INK(.95), .1, i);
    for (let f = -1; f <= 1; f++) brush(c, curve(foot, [foot[0] - dx * k * .3 + f * k * .12, foot[1] - dy * k * .3 + k * .15], [foot[0] - dx * k * .45 + f * k * .2, foot[1] + k * .35], 6), x => P.w0 * .08 * (1 - x), INK(1), 0); }
  // body
  brush(c, pts, wf, INK(.94), .04, 3);
  // belly band & scales
  const bel = pts.map((p, i) => { const q = pts[Math.min(n, i + 1)], o = pts[Math.max(0, i - 1)]; let nx = -(q[1] - o[1]), ny = q[0] - o[0]; const l = Math.hypot(nx, ny) || 1; return [p[0] + nx / l * wf(i / n) * .26, p[1] + ny / l * wf(i / n) * .26]; });
  brush(c, bel, s => wf(s) * .38, PAPER(.23), .1, 5);
  c.strokeStyle = PAPER(.32); c.lineWidth = Math.max(.6, P.w0 * .04);
  for (let i = 3; i < n - 2; i += 2) { const p = pts[i], q = pts[i + 1]; const ang = Math.atan2(q[1] - p[1], q[0] - p[0]); const r = wf(i / n) * .28; for (const off of [-.25, .05]) { const ox = -Math.sin(ang) * wf(i / n) * off, oy = Math.cos(ang) * wf(i / n) * off; c.beginPath(); c.arc(p[0] + ox, p[1] + oy, r, ang + Math.PI * .55, ang + Math.PI * 1.45); c.stroke(); } }
  // dorsal spikes
  for (let i = 4; i < n - 3; i += 3) { const p = pts[i], q = pts[i + 1]; let dx = q[0] - p[0], dy = q[1] - p[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l; const w = wf(i / n) * .5, sp = P.w0 * .5 * (1 - i / n); const b = [p[0] + dy * w, p[1] - dx * w]; poly(c, [[b[0] - dx * sp * .4, b[1] - dy * sp * .4], [b[0] + dy * sp + dx * sp * .5, b[1] - dx * sp + dy * sp * .5], [b[0] + dx * sp * .5, b[1] + dy * sp * .5]], INK(.95)); }
  // tail flame
  { const p = pts[n], q = pts[n - 2]; const a = Math.atan2(p[1] - q[1], p[0] - q[0]); for (let k = -2; k <= 2; k++) { const l = P.w0 * (1.6 - Math.abs(k) * .3); brush(c, curve(p, [p[0] + Math.cos(a + k * .25) * l * .5, p[1] + Math.sin(a + k * .25) * l * .5 + Math.sin(T * 5 + k) * 4], [p[0] + Math.cos(a + k * .35) * l, p[1] + Math.sin(a + k * .35) * l], 8), x => P.w0 * .16 * (1 - x), INK(.85), 0); } }
  // head
  const p0 = pts[0], p1 = pts[3]; const ha = Math.atan2(p0[1] - p1[1], p0[0] - p1[0]); const hs = P.hs * 60;
  c.save(); c.translate(p0[0], p0[1]); c.rotate(ha); c.scale(hs / 60, hs / 60);
  // mane
  for (let k = 0; k < 9; k++) { const a = Math.PI * (.55 + k * .11), l = 70 + (k % 3) * 18; brush(c, curve([-10, 0], [-30 + Math.cos(a) * l * .5, Math.sin(a) * l * .5 - 10], [-55 + Math.cos(a) * l, Math.sin(a) * l * .7 + Math.sin(T * 4 + k) * 6 - 20], 10), x => 9 * (1 - x), INK(.92), .1, k); }
  // horns
  for (const s of [-1, 1]) brush(c, curve([0, -18 * s], [-30, -48 * s], [-70, -52 * s + 10 * s], 12), x => 9 * (1 - x * .85), INK(1), .05);
  // skull + snout
  const m = P.mouth;
  c.beginPath(); c.moveTo(-14, -26); c.quadraticCurveTo(20, -38, 48, -20); c.quadraticCurveTo(78, -18, 92, -6); c.lineTo(90, 2); c.quadraticCurveTo(50, 4, 20, 8); c.quadraticCurveTo(-8, 18, -16, 14); c.closePath(); c.fillStyle = INK(1); c.fill();
  // lower jaw
  c.save(); c.translate(10, 6); c.rotate(m * .55); c.beginPath(); c.moveTo(-10, 0); c.quadraticCurveTo(40, 6, 74, 4); c.lineTo(72, 12); c.quadraticCurveTo(30, 26, -12, 16); c.closePath(); c.fillStyle = INK(1); c.fill();
  c.fillStyle = PAPER(.9); for (let k = 0; k < 6; k++) { c.beginPath(); c.moveTo(18 + k * 9, 2); c.lineTo(22 + k * 9, -6); c.lineTo(26 + k * 9, 2); c.fill(); }
  c.restore();
  c.fillStyle = PAPER(.85); for (let k = 0; k < 6; k++) { c.beginPath(); c.moveTo(26 + k * 10, 4); c.lineTo(30 + k * 10, 12 + m * 3); c.lineTo(34 + k * 10, 4); c.fill(); }
  // brow ridge, nostril, eye
  brush(c, curve([-4, -24], [20, -36], [38, -24], 10), x => 4 * (1 - x * .5), PAPER(.35), 0);
  blob(c, 84, -10, 3, 2, PAPER(.5));
  blob(c, 22, -18, 8, 5.5, RED(.95)); blob(c, 23, -18, 2.4, 4.5, INK(1)); blob(c, 20, -20, 1.6, 1.6, PAPER(.95));
  // whiskers
  for (const s of [-1, 1]) brush(c, cubic([78, -2 * s], [60, 40 * s + Math.sin(T * 3) * 10], [-20, 60 * s + Math.sin(T * 2.2 + s) * 20], [-120, 50 * s + Math.sin(T * 2.6 + s) * 30], 26), x => 3.5 * (1 - x), INK(.9), 0);
  c.restore();
  c.restore();
  return pts;
}

/* ---------------- samurai ---------------- */
// origin = feet, facing left. pose: {mode:'stand'|'iai'|'slash'|'sheath', p:0..1, wind}
const PEAK = [1003, 432];
function drawSamurai(c, x, y, s, pose) {
  c.save(); c.translate(x, y); c.scale(s, s); const w = T;
